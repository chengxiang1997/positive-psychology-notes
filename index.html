<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈佛积极心理学 · 幸福课完整学习资料</title>
<meta name="description" content="哈佛大学《积极心理学》(幸福课, Tal Ben-Shahar) 23课完整学习资料交互版。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23F4A63C'/%3E%3Cpath d='M9 18a7 7 0 0 1 14 0' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============ 设计 token ============ */
:root{
  --bg:#FBF7F0;
  --bg-soft:#F4EDE1;
  --paper:#FFFFFF;
  --ink:#2B2620;
  --ink-soft:#6B6155;
  --line:#E7DCCB;
  --sun:#E8993D;        /* 金色 · 阳光/积极 */
  --sun-deep:#C97A24;
  --sky:#5B8DAE;        /* 清晨蓝 · 宁静 */
  --sky-soft:#EAF1F5;
  --leaf:#7A9B6B;       /* 绿 · 成长 */
  --warm:#C96F5C;       /* 陶红 · 关系 */
  --shadow:0 6px 24px rgba(70,50,20,.08);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.85;
  font-size:var(--fs,16px);
}
::selection{background:rgba(232,153,61,.25)}

/* ============ 顶部 Hero ============ */
.hero{
  position:relative;
  background:
    radial-gradient(1200px 400px at 80% -10%, rgba(232,153,61,.18), transparent 60%),
    radial-gradient(900px 400px at 5% 10%, rgba(91,141,174,.16), transparent 60%),
    var(--bg-soft);
  border-bottom:1px solid var(--line);
  padding:56px 24px 40px;
  text-align:center;
  overflow:hidden;
}
.hero .sunmark{
  width:56px;height:56px;margin:0 auto 18px;
  background:radial-gradient(circle at 50% 45%, var(--sun), var(--sun-deep));
  border-radius:50%;
  display:grid;place-items:center;
  box-shadow:0 0 0 8px rgba(232,153,61,.15);
}
.hero .sunmark svg{width:30px;height:30px}
.hero h1{
  font-size:clamp(26px,4.5vw,44px);
  font-weight:900;
  letter-spacing:.5px;
  color:var(--ink);
}
.hero .sub{
  margin-top:10px;
  font-size:clamp(14px,2vw,17px);
  color:var(--ink-soft);
  max-width:640px;margin-left:auto;margin-right:auto;
}
.hero .meta{
  margin-top:18px;
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.hero .chip{
  background:var(--paper);
  border:1px solid var(--line);
  color:var(--ink-soft);
  font-size:12.5px;
  padding:5px 12px;border-radius:999px;
}
.hero .stats{
  margin-top:22px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;
}
.hero .stat{text-align:center}
.hero .stat b{display:block;font-size:28px;color:var(--sun-deep);font-weight:800}
.hero .stat span{font-size:12px;color:var(--ink-soft)}

/* ============ 布局 ============ */
.layout{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0;padding:28px 0 80px}

/* ============ 侧边导航 ============ */
.sidebar{
  width:264px;flex-shrink:0;
  position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;
}
.sidebar h3{
  font-size:13px;color:var(--ink-soft);text-transform:none;letter-spacing:1px;
  margin:12px 6px 8px;font-weight:700;
}
.sidebar .phase{font-size:12px;color:var(--sky);font-weight:700;margin:14px 8px 6px}
.navlist{list-style:none}
.navlist li{margin:2px 0}
.navlist a{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-radius:8px;
  color:var(--ink-soft);text-decoration:none;font-size:13.5px;
  transition:background .15s,color .15s;
}
.navlist a:hover{background:var(--bg-soft);color:var(--ink)}
.navlist a.active{background:var(--sky-soft);color:var(--sky);font-weight:600}
.navlist a .no{font-size:11.5px;color:var(--sun-deep);font-weight:700;width:20px;flex-shrink:0}
.navlist a .dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:var(--line)}
.navlist a.done .dot{background:var(--leaf)}

/* ============ 进度条 ============ */
.progressbar{
  position:sticky;top:0;z-index:20;
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:10px 20px;
}
.progressbar .inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px}
.progressbar .label{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.progressbar .track{flex:1;height:8px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
.progressbar .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--sun),var(--sun-deep));border-radius:99px;transition:width .4s}
.progressbar .pct{font-size:12.5px;color:var(--sun-deep);font-weight:700;min-width:44px;text-align:right}

/* ============ 视图容器 ============ */
.view{display:none}
.view.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 课卡片 ============ */
.lesson-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:22px;overflow:hidden;
}
.lesson-head{
  padding:22px 26px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
}
.lesson-head .badge{
  width:46px;height:46px;flex-shrink:0;border-radius:12px;
  background:var(--sky-soft);color:var(--sky);
  display:grid;place-items:center;font-size:20px;font-weight:800;
}
.lesson-head .badge.gold{background:rgba(232,153,61,.16);color:var(--sun-deep)}
.lesson-head h2{font-size:21px;font-weight:800;line-height:1.3}
.lesson-head .theme{color:var(--ink-soft);font-size:13.5px;margin-top:2px}
.lesson-body{padding:8px 26px 24px}
.section-label{
  font-size:12.5px;font-weight:800;letter-spacing:1px;
  color:var(--paper);padding:3px 12px;border-radius:999px;display:inline-block;
  margin:16px 0 10px;
}
.section-label.key{background:var(--sun)}
.section-label.deep{background:var(--sky)}
.section-label.quote{background:var(--leaf)}
.card-list{list-style:none}
.card-list li{
  position:relative;padding:6px 0 6px 22px;font-size:15px;
}
.card-list li::before{
  content:"";position:absolute;left:2px;top:16px;width:8px;height:8px;border-radius:50%;
  background:var(--sun);
}
.section-label.deep + .card-list li::before{background:var(--sky)}
.deep-block{margin:8px 0 0}
.deep-block .dtitle{
  font-weight:700;font-size:15px;color:var(--ink);margin:16px 0 4px;
  padding-left:10px;border-left:3px solid var(--sun);
}
.card-list li b{color:var(--sun-deep)}
.deep-block .card-list li b{color:var(--sky)}
.quote-block{
  background:var(--bg-soft);border-radius:10px;
  padding:14px 18px;margin:8px 0;
  font-size:15px;color:var(--ink);line-height:1.8;
}
.quote-block .src{display:block;margin-top:4px;font-size:12px;color:var(--ink-soft)}
.quote-block .src::before{content:"— ";color:var(--sun-deep)}

/* ============ 总览地图 ============ */
.overview .phase-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;
}
.phase-card h2{font-size:18px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px}
.phase-card .ph-tag{font-size:12px;padding:2px 10px;border-radius:999px;color:#fff;font-weight:700}
.phase-card p.ph-desc{color:var(--ink-soft);font-size:13.5px;margin-top:4px}
.phase-card .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.phase-card .grid a{
  text-decoration:none;color:var(--ink);background:var(--bg-soft);
  border:1px solid var(--line);border-radius:10px;padding:12px;
  font-size:14px;display:flex;gap:8px;align-items:center;
  transition:transform .15s,border-color .15s;
}
.phase-card .grid a:hover{transform:translateY(-2px);border-color:var(--sun)}
.phase-card .grid a .no{color:var(--sun-deep);font-weight:800}
.phase-card .grid a .st{margin-left:auto;font-size:11px;color:var(--ink-soft)}

/* ============ 速查表 ============ */
.concept-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px;margin-bottom:20px;
}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.searchbar input{
  flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);
  border-radius:10px;font-size:14px;background:var(--bg);
  font-family:inherit;outline:none;transition:border-color .15s;
}
.searchbar input:focus{border-color:var(--sun)}
.concept-table{width:100%;border-collapse:collapse;table-layout:fixed}
.concept-table col:nth-child(1){width:22%}
.concept-table col:nth-child(2){width:58%}
.concept-table col:nth-child(3){width:20%}
.concept-table th{
  text-align:left;padding:10px 12px;font-size:13px;color:var(--ink-soft);
  border-bottom:2px solid var(--sun);background:var(--bg-soft);
}
.concept-table td{padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top}
.concept-table tr:hover td{background:var(--bg-soft)}
.concept-table .cname{font-weight:700;color:var(--sky)}
.concept-table .ccur{color:var(--ink-soft);font-size:12.5px;white-space:nowrap}
.empty{color:var(--ink-soft);text-align:center;padding:20px;font-size:14px}

/* ============ 勘误说明 ============ */
.erratum-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px;margin-bottom:20px;
}
.erratum-card h2{font-size:19px;font-weight:800;margin-bottom:4px}
.erratum-card .intro{color:var(--ink-soft);font-size:13.5px;margin-bottom:16px}
.erratum-card h3{font-size:15px;font-weight:700;margin:18px 0 8px;color:var(--ink)}
.erratum-card .ok{color:var(--leaf);font-weight:800}
.erratum-card .warn{color:var(--warm);font-weight:800}
.erratum-card ul{padding-left:22px;font-size:14.5px}
.erratum-card li{margin:6px 0}

/* ============ 金句轮播 ============ */
.quote-daily{
  background:linear-gradient(120deg,rgba(232,153,61,.12),rgba(91,141,174,.10)),var(--bg-soft);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:26px;text-align:center;margin-bottom:20px;
}
.quote-daily .qtext{font-size:18px;font-weight:600;max-width:560px;margin:0 auto;line-height:1.7;color:var(--ink)}
.quote-daily .qfrom{color:var(--ink-soft);font-size:13px;margin-top:8px}
.quote-daily button{
  margin-top:14px;border:none;background:var(--paper);color:var(--sun-deep);
  border:1px solid var(--line);padding:8px 18px;border-radius:999px;cursor:pointer;
  font-family:inherit;font-size:13px;transition:background .15s;
}
.quote-daily button:hover{background:#fff}

/* ============ 页脚 ============ */
.footer{
  border-top:1px solid var(--line);background:var(--bg-soft);
  padding:28px 24px;text-align:center;color:var(--ink-soft);font-size:13px;
}
.footer b{color:var(--ink)}

/* ============ 学习工具条 ============ */
.toolbar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;
}
.toolbar .title{font-size:15px;font-weight:800;color:var(--ink);margin-right:auto}
.toolbar button{
  border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
  padding:6px 14px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:12.5px;
  transition:all .15s;
}
.toolbar button:hover{border-color:var(--sun);color:var(--sun-deep)}
.toolbar button.on{background:var(--sun);color:#fff;border-color:var(--sun)}

/* ============ 响应式 ============ */
@media(max-width:880px){
  .layout{flex-direction:column}
  .sidebar{width:100%;position:static;max-height:none;order:-1}
  .sidebar .navlist{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
  .concept-table{display:block;overflow-x:auto}
}
@media(max-width:520px){
  body{font-size:15px}
  .lesson-head,.lesson-body{padding-left:16px;padding-right:16px}
  .phase-card .grid{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .view.active{animation:none}
}

/* ============ 分区锚点条 ============ */
.part-bar{
  display:flex;gap:8px;flex-wrap:wrap;
  padding:14px 26px;border-bottom:1px solid var(--line);background:var(--bg);
}
.part-bar a{
  text-decoration:none;font-size:13px;font-weight:700;cursor:pointer;
  color:var(--ink-soft);border:1px solid var(--line);background:var(--paper);
  padding:5px 14px;border-radius:999px;transition:all .15s;
}
.part-bar a:hover{color:var(--sun-deep);border-color:var(--sun)}
[id^="part-"]{scroll-margin-top:72px}

/* ============ 深入解读折叠 ============ */
.deep-block .dtitle{
  cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.deep-block .chev{transition:transform .2s;flex-shrink:0;font-size:12px;color:var(--ink-soft)}
.deep-block.collapsed .chev{transform:rotate(-90deg)}
.deep-block.collapsed .card-list{display:none}

/* ============ 汉堡目录 + 侧栏头部 ============ */
.s-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.s-head h3{margin:0 6px 4px}
.menu-toggle{
  display:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);
  width:34px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;
  flex-shrink:0;
}
.menu-toggle:hover{color:var(--sun-deep);border-color:var(--sun)}
.navtop{
  display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink-soft);
  padding:8px;border-radius:8px;font-size:13.5px;cursor:pointer;
}
.navtop:hover{background:var(--bg-soft);color:var(--ink)}
.navtop.active{background:var(--sky-soft);color:var(--sky);font-weight:600}

/* ============ 字号控制 ============ */
.font-ctl{display:flex;gap:6px;align-items:center}
.font-ctl span{font-size:12px;color:var(--ink-soft)}
.font-ctl button{min-width:36px;text-align:center}

/* ============ 回顶按钮 ============ */
#toTop{
  position:fixed;right:24px;bottom:28px;z-index:50;
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--paper);color:var(--sun-deep);
  font-size:18px;cursor:pointer;box-shadow:var(--shadow);
  display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s;
}
#toTop.show{opacity:1;pointer-events:auto}
#toTop:hover{background:#fff}

/* ============ toast 提示 ============ */
#toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:all .3s;z-index:60;
  box-shadow:var(--shadow);max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 金句全库 modal ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(43,38,32,.45);z-index:70;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--paper);border-radius:var(--radius);max-width:640px;width:100%;
  max-height:80vh;display:flex;flex-direction:column;box-shadow:var(--shadow);
  border:1px solid var(--line);overflow:hidden;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px;font-weight:800}
.modal-head button{border:none;background:none;font-size:24px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:0 4px}
.modal-head button:hover{color:var(--ink)}
.modal-body{overflow-y:auto;padding:18px 22px}
.modal-body .m-quote{background:var(--bg-soft);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:14.5px}
.modal-body .m-quote .f{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px}

@media(max-width:880px){
  .menu-toggle{display:block}
  .sidebar .navwrap{display:none}
  .sidebar.open .navwrap{display:block}
  #toTop{right:16px;bottom:20px}
}
</style>
</head>
<body>

<header class="hero">
  <div class="sunmark">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 18a8 8 0 0 1 16 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M12 3v2M5 6l1.5 1.5M19 6l-1.5 1.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
  <h1>哈佛积极心理学 · 幸福课</h1>
  <p class="sub">Positive Psychology · Tal Ben-Shahar · 全23讲完整学习资料（交互版）</p>
  <div class="meta">
    <span class="chip">9 份笔记交叉整合</span>
    <span class="chip">核心要点 · 深入解读 · 金句</span>
    <span class="chip">附速查表 + 勘误说明</span>
  </div>
  <div class="stats">
    <div class="stat"><b>23</b><span>课时</span></div>
    <div class="stat"><b>5</b><span>学习阶段</span></div>
    <div class="stat"><b>24</b><span>VIA 性格优势</span></div>
  </div>
</header>

<div class="progressbar">
  <div class="inner">
    <span class="label">学习进度</span>
    <div class="track"><div class="fill" id="progFill"></div></div>
    <span class="pct" id="progPct">0/23</span>
  </div>
</div>

<div class="layout">

  <!-- ===== 侧边导航 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="s-head">
      <h3>学习目录</h3>
      <button class="menu-toggle" id="menuToggle" aria-label="展开或收起目录">☰</button>
    </div>
    <div class="navwrap">
      <a href="#overview" class="navtop" data-nav="overview">课程总览</a>
      <div id="sideNav"></div>
    </div>
  </aside>

  <!-- ===== 主内容 ===== -->
  <main class="main">

    <!-- 视图：总览 -->
    <section class="view" id="view-overview">
      <div class="toolbar">
        <span class="title">23课全貌地图</span>
        <button id="resetAllBtn">重置学习进度</button>
      </div>
      <div id="overviewBody"></div>
    </section>

    <!-- 视图：逐课 -->
    <section class="view" id="view-lessons">
      <div class="toolbar">
        <span class="title">课程学习</span>
        <div class="font-ctl"><span>字号</span><button id="fontDec" aria-label="缩小字号">A-</button><button id="fontInc" aria-label="放大字号">A+</button></div>
      </div>
      <div class="quote-daily" id="quoteDaily"></div>
      <div id="lessonBody"></div>
      <div class="toolbar" style="margin-top:6px">
        <button id="prevBtn">← 上一课</button>
        <button id="nextBtn">下一课 →</button>
        <span id="curPos" style="margin-left:auto;font-size:13px;color:var(--ink-soft)"></span>
      </div>
    </section>

    <!-- 视图：速查表 -->
    <section class="view" id="view-concepts">
      <div class="toolbar"><span class="title">高频概念速查表</span></div>
      <div class="concept-card">
        <div class="searchbar">
          <input type="text" id="conceptSearch" placeholder="输入关键词搜索概念（如：自尊 / ABC / 乐观）">
          <button id="clearSearch">清除</button>
        </div>
        <table class="concept-table">
          <colgroup><col><col><col></colgroup>
          <thead><tr><th>概念</th><th>含义</th><th>出处课次</th></tr></thead>
          <tbody id="conceptBody"></tbody>
        </table>
        <div class="empty" id="conceptEmpty" style="display:none">未找到匹配的概念</div>
      </div>
    </section>

    <!-- 视图：勘误说明 -->
    <section class="view" id="view-erratum">
      <div class="toolbar"><span class="title">交叉校验说明与勘误</span></div>

/* ============ 状态 ============ */
const DONE_KEY='happiness_lessons_done';
let done=new Set(JSON.parse(localStorage.getItem(DONE_KEY)||'[]'));
let cur=1;              // 当前课
let view='overview';    // 当前视图

/* ============ 渲染：侧边导航 ============ */
function renderNav(){
  const box=document.getElementById('sideNav');
  let html='';
  PHASES.forEach(p=>{
    html+='<div class="phase">'+p.name+'</div><ul class="navlist">';
    p.lessons.forEach(n=>{
      const l=LESSONS.find(x=>x.no===n);
      html+='<li><a href="#lessons-'+n+'" class="'+(done.has(n)?'done':'')+'" data-navless="'+n+'"><span class="no">'+String(n).padStart(2,'0')+'</span>'+l.title+'<span class="dot"></span></a></li>';
    });
    html+='</ul>';
  });
  box.innerHTML=html;
}

/* ============ 渲染：总览地图 ============ */
function renderOverview(){
  const box=document.getElementById('overviewBody');
  let html='';
  PHASES.forEach(p=>{
    html+='<div class="phase-card"><h2><span class="ph-tag" style="background:'+p.tag+'">'+p.name+'</span>'+p.desc+'</h2>';
    html+='<p class="ph-desc">'+p.desc+'</p><div class="grid">';
    p.lessons.forEach(n=>{
      const l=LESSONS.find(x=>x.no===n);
      html+='<a href="#lessons-'+n+'"><span class="no">'+String(n).padStart(2,'0')+'</span><span>'+l.title+'</span><span class="st">'+(done.has(n)?'已学':'未学')+'</span></a>';
    });
    html+='</div></div>';
  });
  box.innerHTML=html;
}

/* ============ 渲染：单课 ============ */
function inline(html){
  return html
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function renderLesson(){
  const l=LESSONS.find(x=>x.no===cur);
  if(!l)return;
  let html='';
  html+='<div class="lesson-card"><div class="lesson-head"><div class="badge gold">'+String(l.no).padStart(2,'0')+'</div><div><h2>第'+cn(l.no)+'课 · '+l.title+'</h2><div class="theme">'+l.theme+'</div></div></div>';
  // 分区锚点条
  html+='<div class="part-bar"><a class="part-link" data-part="part-key" href="#part-key">核心要点</a><a class="part-link" data-part="part-deep" href="#part-deep">深入解读</a><a class="part-link" data-part="part-quote" href="#part-quote">金句</a></div>';
  html+='<div class="lesson-body">';
  // 核心要点
  html+='<div id="part-key"><span class="section-label key">核心要点</span><ul class="card-list">';
  l.key.forEach(k=>{html+='<li>'+inline(k)+'</li>';});
  html+='</ul></div>';
  // 深入解读
  html+='<div id="part-deep"><span class="section-label deep">深入解读</span>';
  l.deep.forEach(d=>{
    html+='<div class="deep-block"><div class="dtitle"><span>'+d.t+'</span><span class="chev">▾</span></div><ul class="card-list">';
    d.l.forEach(x=>{html+='<li>'+inline(x)+'</li>';});
    html+='</ul></div>';
  });
  html+='</div>';
  // 金句
  html+='<div id="part-quote"><span class="section-label quote">金句</span>';
  l.quote.forEach(q=>{
    const src=q.f?('<span class="src">'+q.f+'</span>'):'';
    html+='<div class="quote-block">'+inline(q.t)+src+'</div>';
  });
  html+='</div></div></div>';
  // 完成切换按钮
  html+='<div class="toolbar"><button id="toggleDone" class="'+(done.has(l.no)?'on':'')+'">'+(done.has(l.no)?'已标记完成 · 点击取消':'标记本课已完成')+'</button></div>';
  document.getElementById('lessonBody').innerHTML=html;
  document.getElementById('curPos').textContent='第 '+l.no+' / 23 课';
  document.getElementById('toggleDone').onclick=toggleDone;
  // 更新侧边激活
  document.querySelectorAll('.navlist a').forEach(a=>a.classList.toggle('active',a.dataset.navless==String(cur)));
}
function cn(n){const w=['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三'];return w[n];}

/* ============ 完成切换 / 进度 ============ */
function toggleDone(){
  const was=done.has(cur);
  was?done.delete(cur):done.add(cur);
  localStorage.setItem(DONE_KEY,JSON.stringify([...done]));
  renderLesson();renderNav();renderOverview();updateProgress();
  toast(was?'已取消第'+cn(cur)+'课的完成标记':'已标记第'+cn(cur)+'课完成');
}
function updateProgress(){
  const n=done.size;
  document.getElementById('progFill').style.width=(n/23*100)+'%';
  document.getElementById('progPct').textContent=n+'/23';
}

/* ============ Hash 路由 ============ */
function parseHash(){
  const h=(location.hash||'').replace('#','');
  if(/^lessons-(\d+)$/.test(h)){const n=parseInt(h.split('-')[1]);return {view:'lessons',no:(n>=1&&n<=23)?n:1};}
  if(h==='view-lessons')return {view:'lessons'};
  if(h==='concepts')return {view:'concepts'};
  if(h==='erratum')return {view:'erratum'};
  return {view:'overview'};
}
function setHash(v,no){
  const h=(v==='lessons'&&no)?('lessons-'+no):v;
  if(location.hash==='#'+h){goView(v);return;}
  location.hash=h;
}
function applyHash(){
  const p=parseHash();
  if(p.no){cur=p.no;}
  goView(p.view);
}

/* ============ 视图切换 ============ */
function goView(v){
  view=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  if(v==='lessons'){renderLesson();refreshQuote();}
  if(v==='overview'){renderOverview();}
  if(v==='concepts'){renderConcepts('');}
  if(v==='erratum'){renderErratum();}
  // 激活导航
  document.querySelectorAll('.navlist a').forEach(a=>a.classList.toggle('active',a.dataset.navless==String(cur)));
  const navtop=document.querySelector('.navtop');
  if(navtop)navtop.classList.toggle('active',v!=='lessons');
  // 移动端收起目录
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============ 速查表 ============ */
function renderConcepts(kw){
  const body=document.getElementById('conceptBody');
  const q=(kw||'').trim().toLowerCase();
  const list=CONCEPTS.filter(c=>!q||c.n.toLowerCase().includes(q)||c.d.toLowerCase().includes(q)||c.c.toLowerCase().includes(q));
  let html='';
  list.forEach(c=>{
    html+='<tr><td class="cname">'+c.n+'</td><td>'+c.d+'</td><td class="ccur">第'+c.c+'课</td></tr>';
  });
  body.innerHTML=html;
  document.getElementById('conceptEmpty').style.display=list.length?'none':'block';
}

/* ============ 勘误 ============ */
function renderErratum(){
  let html='<h2>交叉校验说明与勘误</h2><p class="intro">'+ERRATUM.intro+'</p>';
  html+='<h3><span class="ok">A. 各来源一致、可放心引用</span></h3><ul>';
  ERRATUM.A.forEach(x=>html+='<li>'+inline(x)+'</li>');
  html+='</ul><h3><span class="warn">B. 存在出入、已做取舍</span></h3><ul>';
  ERRATUM.B.forEach(x=>html+='<li>'+inline(x)+'</li>');
  html+='</ul><h3>注意点</h3><ul><li>'+inline(ERRATUM.note)+'</li></ul>';
  document.getElementById('erratumBody').innerHTML=html;
}

/* ============ 金句轮播 ============ */
let qidx=-1;
function refreshQuote(){
  if(QUOTES.length===0)return;
  let n;
  do{n=Math.floor(Math.random()*QUOTES.length);}while(n===qidx&&QUOTES.length>1);
  qidx=n;const q=QUOTES[n];
  document.getElementById('quoteDaily').innerHTML=
    '<div class="qtext">'+q.t+'</div><div class="qfrom">'+(q.f?q.f:'')+'</div><div style="margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button onclick="nextQuote()">换一句</button><button data-quoteall="1" style="border:none;background:var(--paper);color:var(--sun-deep);border:1px solid var(--line);padding:8px 18px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:13px;transition:background .15s">全部金句</button></div>';
}
function nextQuote(){refreshQuote();}
function openQuoteModal(){
  let h='';
  QUOTES.forEach(q=>{h+='<div class="m-quote">'+q.t+(q.f?'<span class="f">'+q.f+'</span>':'')+'</div>';});
  document.getElementById('quoteModalBody').innerHTML=h;
  document.getElementById('quoteModal').classList.add('open');
}
function closeQuoteModal(){document.getElementById('quoteModal').classList.remove('open');}

/* ============ toast ============ */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1800);
}

/* ============ 字号控制 ============ */
function setFont(delta){
  let fs=parseInt(localStorage.getItem('happiness_font')||'16');
  fs=Math.min(18,Math.max(14,fs+delta));
  localStorage.setItem('happiness_font',String(fs));
  document.documentElement.style.setProperty('--fs',fs+'px');
}

/* ============ 事件绑定 ============ */
document.addEventListener('click',function(e){
  // 课/视图导航（hash）
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();setHash('lessons',parseInt(go.dataset.go));return;}
  const nav=e.target.closest('[data-nav]');
  if(nav){e.preventDefault();setHash(nav.dataset.nav);return;}
  // 分区锚点滚动
  const pl=e.target.closest('.part-link');
  if(pl){e.preventDefault();const t=document.getElementById(pl.dataset.part);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return;}
  // 深入解读小节折叠
  const dt=e.target.closest('.dtitle');
  if(dt){dt.parentElement.classList.toggle('collapsed');return;}
  // 回顶
  if(e.target.closest('#toTop')){window.scrollTo({top:0,behavior:'smooth'});return;}
  // 金句全库
  if(e.target.closest('[data-quoteall]')){openQuoteModal();return;}
  if(e.target.closest('#quoteClose')){closeQuoteModal();return;}
  if(e.target.closest('.modal-overlay')&&!e.target.closest('.modal')){closeQuoteModal();return;}
  // 汉堡目录
  if(e.target.closest('#menuToggle')){document.getElementById('sidebar').classList.toggle('open');return;}
});
document.getElementById('prevBtn').addEventListener('click',function(){if(cur>1)setHash('lessons',cur-1);});
document.getElementById('nextBtn').addEventListener('click',function(){if(cur<23)setHash('lessons',cur+1);});
document.getElementById('resetAllBtn').addEventListener('click',function(){
  if(confirm('确定要清空全部学习进度标记吗？')){
    done=new Set();localStorage.setItem(DONE_KEY,'[]');
    renderNav();renderOverview();updateProgress();toast('已清空全部学习进度');
  }
});
document.getElementById('conceptSearch').addEventListener('input',function(){renderConcepts(this.value);});
document.getElementById('clearSearch').addEventListener('click',function(){
  document.getElementById('conceptSearch').value='';renderConcepts('');
});
document.getElementById('fontDec').addEventListener('click',function(){setFont(-1);});
document.getElementById('fontInc').addEventListener('click',function(){setFont(1);});
// 键盘左右翻课
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowLeft'){if(cur>1){e.preventDefault();setHash('lessons',cur-1);}}
  if(e.key==='ArrowRight'){if(cur<23){e.preventDefault();setHash('lessons',cur+1);}}
});
// 回顶按钮显示
window.addEventListener('scroll',function(){
  document.getElementById('toTop').classList.toggle('show',window.scrollY>500);
});
// hash 路由
window.addEventListener('hashchange',applyHash);

/* ============ 初始化 ============ */
renderNav();renderOverview();updateProgress();setFont(0);applyHash();
</script>
</body>
</html>
